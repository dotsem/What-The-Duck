name: Flutter CI

on:
  push:
  pull_request:

jobs:
  setup:
    name: Setup Flutter
    runs-on: ubuntu-latest
    outputs:
      flutter-path: ${{ steps.flutter.outputs.flutter-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

  analyze:
    name: Analyze & Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze code
        run: flutter analyze
      - name: Check for code smells
        run: dart run dart_code_metrics:metrics analyze lib

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Run tests
        run: flutter test --coverage

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [setup, analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        run: flutter build apk --release

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [setup, analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build iOS
        run: flutter build ios --release --no-codesign

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [setup, analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: Build Linux
        run: flutter build linux --release
